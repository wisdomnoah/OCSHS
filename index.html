<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Obele Community Senior High School (OCSHS) — Surulere, Lagos. Honesty, Obedience, and Hard Work. Established 1981." />
    <title>Obele Community Senior High School — OCSHS</title>
    <meta property="og:title" content="Obele Community Senior High School" />
    <meta property="og:description" content="Honesty, Obedience, and Hard Work. Empowering Surulere since 1981." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0A1F1C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ocshs-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(t);
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
